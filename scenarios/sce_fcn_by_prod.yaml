# =============================================================================
# Scenario definitions for autocallable model comparison.
#
# Each scenario specifies only what changes from the base config (config.yaml).
# All other parameters are inherited unchanged.
#
# Two groups:
#   market  — vary the vol surface; product structure is fixed
#   product — vary the product structure; vol surface is fixed (base case)
#
# Spread (bp) = (max model price − min model price) × 10,000
# A large spread signals high model risk for that scenario.
# =============================================================================

base_config: config_base_20260626.yaml   # Path to base config (relative to project root)

scenarios:

  # ── Group 1: Market scenarios ───────────────────────────────────────────────
  # Hold the product structure fixed and vary the vol surface.
  # Tests: does a steeper skew / higher vol / different term structure
  # widen or narrow the gap between Local Vol, Heston, and SABR?

  # - name: Base case
  #   group: market
  #   description: >
  #     Benchmark. Term-structure surface with vol_short=25%, vol_long=18%,
  #     skew=-0.10 at 1y. Step-down snowball autocall.

  # - name: High vol
  #   group: market
  #   description: >
  #     Both short and long vol raised by +7%. Models must work harder to
  #     fit the higher level; stochastic-vol models may diverge more.
  #   overrides:
  #     vol_surface:
  #       vol_short: 0.70
  #       vol_long: 0.50

  # - name: Low vol
  #   group: market
  #   description: >
  #     Calm market: vol_short=18%, vol_long=14%. Skew effects are smaller
  #     in absolute terms; model spread expected to compress.
  #   overrides:
  #     vol_surface:
  #       vol_short: 0.10
  #       vol_long: 0.14

  # - name: Steep skew
  #   group: market
  #   description: >
  #     Skew doubled to -0.20 at 1y (effective -0.28 at 6m). Represents
  #     a stressed or post-crash environment with large put premium.
  #     Model disagreement on skew dynamics should widen the spread.
  #   overrides:
  #     vol_surface:
  #       skew: -0.20



  # ── Group 2: Product scenarios ──────────────────────────────────────────────
  # Hold the vol surface fixed at the base case and vary the product structure.
  # Tests: which product features make pricing most sensitive to model choice?

  - name: Standard FCN
    group: product
    description: >
      ATM KO Barrier. EKI 80%. CPN 12% FCN
    overrides:
      product:
        autocall_barriers: 1.00
        capital_barrier: 0.80        
        conditional_coupon: true
        coupon_rate: 0.01       # flat per period (not snowball)
        coupon_barrier: 0.00
        
  - name: Deeper KO
    group: product
    description: >
      85% KO Barrier. EKI 80%. CPN 12% FCN
    overrides:
      product:
        autocall_barriers: 0.85
        capital_barrier: 0.80        
        conditional_coupon: true
        coupon_rate: 0.01       # flat per period (not snowball)
        coupon_barrier: 0.00

  - name: No KI
    group: product
    description: >
      ATM KO Barrier. EKI 200%. CPN 12% FCN
    overrides:
      product:
        autocall_barriers: 1.00
        capital_barrier: 10.00        
        conditional_coupon: true
        coupon_rate: 0.01       # flat per period (not snowball)
        coupon_barrier: 0.00        