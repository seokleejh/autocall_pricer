# =============================================================================
# Worst-of basket scenario set: vary the correlation between the two assets.
# Base config: configs/config_worst_of_2asset.yaml
# =============================================================================

base_config: configs/config_worst_of_3_els.yaml



scenarios:

  - name: Base case 
    group: correlation
    description: >
      Benchmark correlation from the base config.

  - name: Low correlation (rho=0.20)
    group: correlation
    description: >
      Lower asset-asset correlation increases dispersion between the two
      assets, which worsens the worst-of outcome and should lower price.
    overrides:
      correlation:
        - [1.00, 0.20, 0.20]
        - [0.20, 1.00, 0.20]
        - [0.20, 0.20, 1.00]

  - name: High correlation (rho=0.90)
    group: correlation
    description: >
      Near-perfect correlation makes the worst-of note behave closer to a
      single-asset autocall on either asset.
    overrides:
      correlation:
        - [1.00, 0.90, 0.90]
        - [0.90, 1.00, 0.90]
        - [0.90, 0.90, 1.00]
