# =============================================================================
# Autocallable Pricer — Worst-of Basket Example (2 assets)
#
# This config demonstrates worst-of basket pricing: the note's payoff
# depends on the WORST-performing of the two assets below at each
# observation date. All barriers under `product:` are performance fractions
# applied to worst-of performance (min_i S_i(t)/S_i(0)), exactly as in the
# single-asset schema -- they are NOT specific to either asset individually.
#
# Presence of `assets:` switches the loader into basket mode: the top-level
# `market:` and `vol_surface:` blocks (used by single-asset configs such as
# ../config.yaml) are ignored in this mode.
#
# v1 constraint: all assets must share the same discount rate (`rate`) --
# a worst-of note has one discount curve regardless of how many underlyings
# it references. div_yield may differ per asset.
#
# SABR is not supported for basket pricing (see models/basket.py) -- only
# local_vol and heston are used below regardless of the `models:` block.
# =============================================================================

assets:
  - name: AssetA
    spot: 100.0
    rate: 0.03
    div_yield: 0.01
    vol_surface:
      type: term_structure
      vol_short: 0.25
      vol_long: 0.18
      kappa: 1.5
      skew: -0.10
      convexity: 0.02
      T_max: 5.0

  - name: AssetB
    spot: 100.0
    rate: 0.03        # must match AssetA's rate (v1 constraint)
    div_yield: 0.02
    vol_surface:
      type: term_structure
      vol_short: 0.30
      vol_long: 0.22
      kappa: 1.3
      skew: -0.12
      convexity: 0.02
      T_max: 5.0

# Asset-asset correlation matrix, order matches the `assets:` list above.
correlation:
  - [1.00, 0.60]
  - [0.60, 1.00]


# ── Simulation parameters ─────────────────────────────────────────────────────
simulation:
  n_paths: 10000
  seed: 42
  antithetic: true


# ── Product specification (worst-of performance fractions) ───────────────────
product:
  notional: 1.0
  maturity: 3.0
  observation_dates: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

  # Autocalls if the WORST asset's performance clears the barrier.
  autocall_barriers: [0.85, 0.85, 0.80, 0.75, 0.70, 0.65]

  coupon_rate: [0.08, 0.16, 0.24, 0.32, 0.40, 0.48]

  conditional_coupon: false
  coupon_barrier: 0.70

  # Capital protection: breached only if the WORST asset falls this far.
  capital_barrier_active: true
  capital_barrier: 0.55


# ── Models to run ─────────────────────────────────────────────────────────────
models:
  local_vol: true   # Basket Local Vol (correlated Dupire, exact correlation recovery)
  heston: true       # Basket Heston (correlated spot Brownians; see models/basket.py
                     # for the approximate nature of correlation recovery here)
  lsv: false         # not supported for basket pricing (single-asset only)
  sabr: false        # not supported for basket pricing
